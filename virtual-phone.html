<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
<title>🌸 小可爱虚拟手机</title>
<style>
/* ===== Theme Variables ===== */
:root {
  --pink: #FFB3C6; --pink-dark: #F291A8; --pink-light: #FFE4EC;
  --lavender: #C9B1FF; --lavender-dark: #B08EE6; --lavender-light: #F0E4FF;
  --mint: #B5EAD7; --mint-dark: #7ECBA1;
  --peach: #FFDAC1; --peach-dark: #F2C19E;
  --sky: #B8E0F0; --sky-dark: #7EBDD4;
  --bg: #FFF5F7; --card: #FFFFFF;
  --text: #5B4A6A; --text-light: #9B8AAA; --text-lighter: #C4B8D0;
  --shadow: 0 2px 20px rgba(180,150,180,0.15);
  --shadow-sm: 0 1px 8px rgba(180,150,180,0.1);
  --shadow-lg: 0 8px 30px rgba(180,150,180,0.2);
  --radius: 22px; --radius-sm: 14px; --radius-xs: 10px;
  --font: 'Segoe UI','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  --transition: 0.28s cubic-bezier(0.4,0,0.2,1);
}
/* Theme: Mint */
[data-theme="mint"] {
  --pink: #8ED4B5; --pink-dark: #6AB894; --pink-light: #D4F0E4;
  --lavender: #A8D8C8; --lavender-dark: #7EBAA0;
  --peach: #C8E8D8; --peach-dark: #A0CCB8;
  --sky: #B0D8E8; --sky-dark: #88B8CC;
  --bg: #F5FFFA; --text: #3A5A4A;
  --text-light: #7A9A8A; --text-lighter: #B0C8BA;
}
/* Theme: Lavender */
[data-theme="lavender"] {
  --pink: #C0A8E8; --pink-dark: #A080D0; --pink-light: #E8DCF8;
  --lavender: #B8A0E8; --lavender-dark: #9078C8;
  --peach: #D0C0F0; --peach-dark: #B0A0D8;
  --sky: #C0C8F0; --sky-dark: #98A0D0;
  --bg: #F8F5FF; --text: #4A3A6A;
  --text-light: #8A7AAA; --text-lighter: #C0B8D8;
}
/* Theme: Warm */
[data-theme="warm"] {
  --pink: #F8B88A; --pink-dark: #E89868; --pink-light: #FDE8D8;
  --lavender: #F0C098; --lavender-dark: #D8A078;
  --peach: #FDD8B8; --peach-dark: #F0B890;
  --sky: #E8D0B0; --sky-dark: #D0B088;
  --bg: #FFFBF5; --text: #5A4030;
  --text-light: #9A8070; --text-lighter: #C8B8A8;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{
  width:100%;height:100%;font-family:var(--font);
  background:#2a2030;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;-webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}

/* ===== Phone Frame ===== */
.phone-frame{
  width:100%;max-width:430px;height:100vh;max-height:100vh;
  background:var(--bg);position:relative;overflow:hidden;
  display:flex;flex-direction:column;
}
@media (min-width:500px){
  .phone-frame{border-radius:40px;height:94vh;max-height:940px;
  box-shadow:0 0 0 3px #302430,0 0 0 7px #4a3a4a,0 0 0 9px #1a141a,0 24px 70px rgba(0,0,0,0.4);}
}
@media (max-width:499px){
  .phone-frame{border-radius:0;box-shadow:none;max-height:100vh;height:100vh;}
}

/* ===== Status Bar ===== */
.status-bar{
  padding:14px 28px 8px;display:flex;justify-content:space-between;align-items:center;
  font-size:12px;font-weight:700;color:var(--text);z-index:110;flex-shrink:0;
  position:relative;
}
.status-bar .time{font-size:15px;font-weight:800;letter-spacing:0.5px;}
.status-icons{display:flex;gap:7px;align-items:center;font-size:13px;}
.signal-bars{display:flex;gap:2px;align-items:flex-end;height:14px;}
.signal-bars span{width:3px;background:var(--text);border-radius:1px;}
.signal-bars span:nth-child(1){height:4px;}.signal-bars span:nth-child(2){height:7px;}
.signal-bars span:nth-child(3){height:10px;}.signal-bars span:nth-child(4){height:13px;}
.battery-icon{width:24px;height:12px;border:2px solid var(--text);border-radius:3px;position:relative;display:flex;align-items:center;padding:2px;}
.battery-icon::after{content:'';position:absolute;right:-4px;top:2px;width:2px;height:5px;background:var(--text);border-radius:0 1px 1px 0;}
.battery-fill{height:100%;background:var(--text);border-radius:1px;}

/* ===== Page Container ===== */
.page-container{flex:1;overflow:hidden;position:relative;}
.page{
  position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;
  transition:opacity 0.32s ease,transform 0.32s cubic-bezier(0.32,0.72,0,1);
  transform:translateX(40px);overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
.page.active{opacity:1;pointer-events:auto;transform:translateX(0);}
.page.slide-left{transform:translateX(-30px);opacity:0.5;}
.page.slide-right{transform:translateX(30px);}
.page-header{
  padding:6px 16px 10px;display:flex;align-items:center;gap:12px;
  flex-shrink:0;position:sticky;top:0;z-index:10;background:rgba(255,245,247,0.85);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
[data-theme="mint"] .page-header{background:rgba(245,255,250,0.85);}
[data-theme="lavender"] .page-header{background:rgba(248,245,255,0.85);}
[data-theme="warm"] .page-header{background:rgba(255,251,245,0.85);}
.page-header .back-btn{
  width:34px;height:34px;border-radius:50%;border:none;
  background:var(--card);color:var(--text);font-size:16px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-sm);transition:var(--transition);
}
.page-header .back-btn:active{transform:scale(0.9);}
.page-header .title{font-size:17px;font-weight:700;color:var(--text);}
.page-body{flex:1;overflow-y:auto;padding:0 16px 20px;}

/* ===== Lock Screen ===== */
.lock-screen{
  position:absolute;inset:0;z-index:200;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  transition:transform 0.55s cubic-bezier(0.4,0,0.2,1),opacity 0.55s ease;
}
.lock-screen.unlocked{transform:translateY(-105%);opacity:0;pointer-events:none;}
.lock-wallpaper{
  position:absolute;inset:0;background-size:cover;background-position:center;
  background-repeat:no-repeat;
}
.lock-wallpaper.default-bg{background:linear-gradient(160deg,#FFE0EC,#ECD8F8 25%,#D8E4F8 50%,#E8D8F0 75%,#FFE8D8);}
.lock-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.08);}
.lock-time{
  font-family:'SimSun','STSong','Songti SC','Noto Serif SC','Serif',serif;
  font-size:72px;font-weight:400;color:#fff;letter-spacing:4px;
  position:relative;z-index:1;text-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.lock-date{
  font-family:'SimSun','STSong','Songti SC','Noto Serif SC','Serif',serif;
  font-size:18px;color:rgba(255,255,255,0.9);margin-bottom:36px;
  position:relative;z-index:1;font-weight:400;text-shadow:0 1px 6px rgba(0,0,0,0.15);
}
.lock-notifications{
  background:rgba(255,255,255,0.45);border-radius:18px;padding:14px 20px;
  margin-bottom:48px;min-width:270px;text-align:center;position:relative;z-index:1;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.lock-notif-item{font-size:13px;color:var(--text);padding:4px 0;display:flex;align-items:center;gap:8px;justify-content:center;}
.lock-hint{
  font-size:14px;color:rgba(255,255,255,0.7);animation:bounce 2.2s infinite;
  display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;z-index:1;
  font-family:var(--font);
}
.lock-hint span{font-size:30px;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}

/* ===== Home Screen ===== */
.home-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.home-wallpaper-img{
  position:absolute;inset:0;background-size:cover;background-position:center;
  background-repeat:no-repeat;opacity:0.5;
}
.home-bg .blob{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.25;}
.home-bg .blob:nth-child(1){width:200px;height:200px;background:var(--pink);top:-40px;right:-40px;}
.home-bg .blob:nth-child(2){width:160px;height:160px;background:var(--lavender);top:30%;left:-50px;}
.home-bg .blob:nth-child(3){width:180px;height:180px;background:var(--sky);bottom:10%;right:-30px;}

.home-search{
  margin:0 20px 12px;padding:10px 16px;background:rgba(255,255,255,0.55);
  border-radius:24px;font-size:13px;color:var(--text-lighter);
  display:flex;align-items:center;gap:8px;position:relative;z-index:1;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--shadow-sm);
}
.home-widget{
  margin:0 20px 16px;padding:14px 18px;background:rgba(255,255,255,0.5);
  border-radius:18px;display:flex;align-items:center;gap:14px;
  position:relative;z-index:1;backdrop-filter:blur(8px);box-shadow:var(--shadow-sm);
}
.home-widget .widget-icon{font-size:36px;}
.home-widget .widget-info{flex:1;}
.home-widget .widget-title{font-size:12px;color:var(--text-light);}
.home-widget .widget-value{font-size:18px;font-weight:700;color:var(--text);}

.app-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:0 20px;position:relative;z-index:1;}
.app-icon{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform 0.18s ease;position:relative;}
.app-icon:active{transform:scale(0.82);}
.app-icon .icon-box{
  width:62px;height:62px;border-radius:17px;display:flex;align-items:center;justify-content:center;
  font-size:30px;box-shadow:0 4px 12px rgba(180,150,180,0.2);position:relative;transition:var(--transition);
}
.app-icon .icon-label{font-size:11px;color:var(--text);font-weight:500;text-align:center;line-height:1.2;}
.app-icon .notif-badge{
  position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;
  background:#FF5C7A;color:#fff;font-size:10px;font-weight:700;
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  padding:0 5px;z-index:2;box-shadow:0 2px 6px rgba(255,92,122,0.4);
}
.dock{
  display:flex;justify-content:center;gap:20px;padding:10px 20px 8px;
  position:relative;z-index:1;
  background:rgba(255,255,255,0.35);border-radius:24px;margin:14px 20px 0;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow-sm);
}
.dock .icon-box{width:50px;height:50px;border-radius:14px;font-size:24px;box-shadow:0 2px 8px rgba(180,150,180,0.15);}
.dock .icon-label{font-size:10px;}
.home-bar{width:134px;height:5px;background:rgba(90,74,106,0.18);border-radius:3px;margin:16px auto 10px;}

/* ===== Notification Center ===== */
.notif-center{
  position:absolute;top:0;left:0;right:0;z-index:150;
  background:rgba(255,245,247,0.95);backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);border-radius:0 0 24px 24px;
  padding:10px 20px 20px;max-height:70vh;overflow-y:auto;
  transform:translateY(-105%);transition:transform 0.4s cubic-bezier(0.4,0,0.2,1);
  box-shadow:0 10px 40px rgba(0,0,0,0.15);
}
[data-theme="mint"] .notif-center{background:rgba(245,255,250,0.95);}
[data-theme="lavender"] .notif-center{background:rgba(248,245,255,0.95);}
[data-theme="warm"] .notif-center{background:rgba(255,251,245,0.95);}
.notif-center.show{transform:translateY(0);}
.notif-handle{width:36px;height:4px;background:#ccc;border-radius:2px;margin:4px auto 14px;}
.notif-item{
  display:flex;gap:12px;padding:12px;background:var(--card);border-radius:var(--radius-sm);
  margin-bottom:8px;box-shadow:var(--shadow-sm);align-items:center;
}
.notif-icon{font-size:24px;flex-shrink:0;}
.notif-text{flex:1;font-size:13px;color:var(--text);}
.notif-time{font-size:10px;color:var(--text-lighter);}
.notif-empty{text-align:center;color:var(--text-lighter);padding:20px;font-size:14px;}

/* ===== Chat List ===== */
.chat-item{
  display:flex;align-items:center;gap:12px;padding:14px;
  background:var(--card);border-radius:var(--radius-sm);margin-bottom:8px;
  cursor:pointer;box-shadow:var(--shadow-sm);transition:var(--transition);position:relative;
}
.chat-item:active{transform:scale(0.98);}
.chat-item .avatar-container{flex-shrink:0;}
.chat-item .avatar-inner{
  border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:22px;overflow:hidden;background:linear-gradient(135deg,var(--pink-light),var(--lavender-light));
}
.chat-item .avatar-inner img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.chat-info{flex:1;min-width:0;}
.chat-name{font-size:15px;font-weight:600;color:var(--text);}
.chat-preview{font-size:12px;color:var(--text-light);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-meta{text-align:right;flex-shrink:0;}
.chat-time{font-size:11px;color:var(--text-lighter);}
.chat-badge{background:linear-gradient(135deg,#FF5C7A,#FF7B93);color:#fff;font-size:10px;min-width:20px;height:20px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;margin-top:4px;font-weight:700;}
.chat-item-menu{
  position:absolute;right:14px;top:50%;transform:translateY(-50%);
  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity 0.2s;
  background:var(--bg);padding:4px 8px;border-radius:20px;
}
.chat-item:hover .chat-item-menu,.chat-item.swiped .chat-item-menu{opacity:1;pointer-events:auto;}
.chat-item-menu button{
  width:30px;height:30px;border-radius:50%;border:none;font-size:14px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}

/* ===== Chat Detail ===== */
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;}
.msg-row{display:flex;gap:8px;align-items:flex-end;animation:msgIn 0.35s ease;}
.msg-row.from-me{flex-direction:row-reverse;}
.msg-row .msg-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:16px;
  overflow:hidden;background:linear-gradient(135deg,var(--pink-light),var(--lavender-light));
}
.msg-row .msg-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.msg-bubble{max-width:72%;padding:10px 15px;border-radius:20px;font-size:14px;line-height:1.55;word-break:break-word;}
.msg-bubble.from-other{background:var(--card);color:var(--text);border-bottom-left-radius:6px;box-shadow:var(--shadow-sm);}
.msg-bubble.from-me{background:linear-gradient(135deg,var(--pink),var(--peach));color:#fff;border-bottom-right-radius:6px;}
.msg-time-label{text-align:center;font-size:11px;color:var(--text-lighter);margin:10px 0 4px;font-weight:500;}
@keyframes msgIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}

.typing-indicator{
  align-self:flex-start;background:var(--card);padding:12px 16px;
  border-radius:20px;border-bottom-left-radius:6px;display:none;gap:4px;
  box-shadow:var(--shadow-sm);margin-left:40px;
}
.typing-indicator.show{display:flex;}
.typing-indicator span{width:8px;height:8px;border-radius:50%;background:var(--text-lighter);animation:typingB 1.4s infinite;}
.typing-indicator span:nth-child(2){animation-delay:0.2s;}
.typing-indicator span:nth-child(3){animation-delay:0.4s;}
@keyframes typingB{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-8px);}}

.chat-input-bar{
  display:flex;gap:10px;padding:10px 16px 18px;background:rgba(255,245,247,0.9);
  align-items:center;flex-shrink:0;border-top:1px solid #f5edf2;
}
.chat-input-bar input{flex:1;padding:11px 18px;border-radius:22px;border:2px solid #f0e0f0;font-size:14px;outline:none;font-family:var(--font);background:var(--card);color:var(--text);transition:var(--transition);}
.chat-input-bar input:focus{border-color:var(--pink);}
.chat-input-bar .send-btn{width:42px;height:42px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;font-size:18px;cursor:pointer;flex-shrink:0;box-shadow:0 3px 10px rgba(200,150,180,0.4);transition:var(--transition);}
.chat-input-bar .send-btn:active{transform:scale(0.88);}

/* ===== Moments ===== */
.moment-card{background:var(--card);border-radius:var(--radius-sm);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}
.moment-header{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.moment-avatar{width:42px;height:42px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;overflow:hidden;background:linear-gradient(135deg,var(--pink-light),var(--lavender-light));}
.moment-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.moment-author{font-size:14px;font-weight:600;color:var(--text);}
.moment-time{font-size:11px;color:var(--text-lighter);}
.moment-content{font-size:14px;color:var(--text);line-height:1.65;margin-bottom:10px;}
.moment-actions{display:flex;gap:24px;padding-top:10px;border-top:1px solid #f7f2f7;}
.moment-action{background:none;border:none;font-size:13px;color:var(--text-light);cursor:pointer;display:flex;align-items:center;gap:4px;}
.moment-action.liked{color:#FF5C7A;}
.moment-comments{margin-top:8px;padding-top:8px;border-top:1px solid #faf5fa;}
.moment-comment{font-size:12px;color:var(--text-light);margin-top:4px;}
.moment-comment strong{color:var(--text);}

/* ===== Contact Profile Page ===== */
.profile-card{
  background:var(--card);border-radius:var(--radius);padding:24px;
  text-align:center;margin-bottom:12px;box-shadow:var(--shadow);
}
.profile-avatar{
  width:80px;height:80px;border-radius:50%;margin:0 auto 16px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;font-size:40px;
  background:linear-gradient(135deg,var(--pink-light),var(--lavender-light));
}
.profile-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.profile-name{font-size:20px;font-weight:700;color:var(--text);}
.profile-rel{font-size:13px;color:var(--pink-dark);margin-top:2px;font-weight:500;}
.profile-bio{font-size:13px;color:var(--text-light);margin-top:10px;line-height:1.5;}
.profile-actions{display:flex;gap:10px;justify-content:center;margin-top:14px;}

/* ===== Character Cart ===== */
.char-cart-item{
  display:flex;gap:10px;padding:12px;background:var(--card);
  border-radius:var(--radius-sm);margin-bottom:6px;align-items:center;
  box-shadow:var(--shadow-sm);
}

/* ===== Settings ===== */
.settings-section{background:var(--card);border-radius:var(--radius-sm);padding:18px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.settings-section h3{font-size:15px;color:var(--text);margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.settings-field{margin-bottom:12px;}
.settings-field label{font-size:12px;color:var(--text-light);display:block;margin-bottom:5px;font-weight:500;}
.settings-field input,.settings-field textarea,.settings-field select{width:100%;padding:11px 15px;border-radius:var(--radius-xs);border:2px solid #f0e0f0;font-size:14px;outline:none;font-family:var(--font);background:#fefafe;color:var(--text);transition:var(--transition);resize:vertical;}
.settings-field input:focus,.settings-field textarea:focus,.settings-field select:focus{border-color:var(--lavender);}
.settings-field textarea{min-height:60px;}

/* ===== Theme Selector ===== */
.theme-options{display:flex;gap:8px;}
.theme-opt{
  width:40px;height:40px;border-radius:50%;cursor:pointer;border:3px solid transparent;
  transition:var(--transition);box-shadow:var(--shadow-sm);
}
.theme-opt.active{border-color:var(--text);transform:scale(1.1);}
.theme-opt.pink{background:linear-gradient(135deg,#FFB3C6,#C9B1FF);}
.theme-opt.mint{background:linear-gradient(135deg,#B5EAD7,#A8D8C8);}
.theme-opt.lavender{background:linear-gradient(135deg,#C9B1FF,#B8A0E8);}
.theme-opt.warm{background:linear-gradient(135deg,#F8B88A,#FDD8B8);}

/* ===== Wallpaper Picker ===== */
.wallpaper-options{display:flex;gap:8px;flex-wrap:wrap;}
.wallpaper-opt{
  width:60px;height:90px;border-radius:10px;cursor:pointer;border:3px solid transparent;
  transition:var(--transition);background-size:cover;background-position:center;
  box-shadow:var(--shadow-sm);
}
.wallpaper-opt.active{border-color:var(--pink-dark);}
.wallpaper-opt.upload-opt{border:2px dashed var(--lavender);display:flex;align-items:center;justify-content:center;font-size:24px;background:#fefafe;}

/* ===== Buttons ===== */
.btn{padding:10px 22px;border-radius:22px;border:none;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font);transition:var(--transition);display:inline-flex;align-items:center;gap:4px;}
.btn:active{transform:scale(0.95);}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff;box-shadow:0 4px 12px rgba(200,150,180,0.35);}
.btn-secondary{background:linear-gradient(135deg,var(--lavender),var(--lavender-dark));color:#fff;box-shadow:0 4px 12px rgba(150,130,200,0.35);}
.btn-outline{background:#fff;color:var(--pink-dark);border:2px solid var(--pink);}
.btn-danger{background:#fff;color:#e74c3c;border:2px solid #e74c3c;}
.btn-sm{padding:6px 14px;font-size:12px;border-radius:16px;}

/* ===== Modal ===== */
.modal-overlay{position:absolute;inset:0;background:rgba(0,0,0,0.3);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s ease;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-sheet{width:100%;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 20px 32px;max-height:78vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.38s cubic-bezier(0.4,0,0.2,1);}
.modal-overlay.show .modal-sheet{transform:translateY(0);}
.modal-handle{width:36px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 18px;}

/* ===== Shopping & Browser & Notes ===== */
.cart-item{display:flex;gap:12px;padding:14px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:8px;align-items:center;box-shadow:var(--shadow-sm);}

.cart-item-info{flex:1;}
.cart-item-name{font-size:14px;font-weight:600;color:var(--text);}
.cart-item-price{font-size:14px;color:var(--pink-dark);font-weight:700;margin-top:3px;}
.cart-item-status{font-size:11px;padding:3px 10px;border-radius:12px;display:inline-block;margin-top:4px;font-weight:500;}
.status-pending{background:#FFF3CD;color:#856404;}
.status-bought{background:var(--mint);color:#1B5E3A;}
.cart-total{padding:14px 8px;text-align:right;font-size:15px;font-weight:700;color:var(--text);flex-shrink:0;}

.browser-bar{display:flex;gap:8px;margin-bottom:14px;}
.browser-bar input{flex:1;padding:11px 18px;border-radius:22px;border:2px solid #f0e0f0;font-size:14px;outline:none;background:var(--card);color:var(--text);}
.browser-bar input:focus{border-color:var(--sky);}
.browser-bar button{padding:10px 18px;border-radius:22px;border:none;background:linear-gradient(135deg,var(--sky),var(--sky-dark));color:#fff;font-weight:600;cursor:pointer;font-size:15px;}
.history-item{padding:14px;background:var(--card);border-radius:var(--radius-sm);margin-bottom:6px;box-shadow:var(--shadow-sm);cursor:pointer;transition:var(--transition);}
.history-item:active{background:#f5f8fc;}
.history-title{font-size:14px;font-weight:500;color:var(--text);}
.history-url{font-size:11px;color:var(--sky-dark);margin-top:3px;}
.history-time{font-size:10px;color:var(--text-lighter);margin-top:3px;}

.note-card{background:linear-gradient(135deg,#FFFBF5,#FFF3F8);padding:16px;border-radius:var(--radius-sm);margin-bottom:8px;box-shadow:var(--shadow-sm);border-left:4px solid var(--peach);}
.note-title{font-size:15px;font-weight:600;color:var(--text);}
.note-content{font-size:13px;color:var(--text-light);margin-top:4px;line-height:1.5;}
.note-time{font-size:10px;color:var(--text-lighter);margin-top:6px;}

.gallery-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.gallery-item{aspect-ratio:1;border-radius:var(--radius-xs);display:flex;align-items:center;justify-content:center;font-size:44px;background:linear-gradient(135deg,#fef5f8,#f5f0fa,#f0f5fa);cursor:pointer;transition:var(--transition);}
.gallery-item:active{transform:scale(0.94);}

.music-card{background:linear-gradient(145deg,var(--lavender),var(--pink),var(--peach));padding:28px 24px;border-radius:var(--radius);color:#fff;text-align:center;margin-bottom:14px;box-shadow:var(--shadow-lg);}
.music-cover{font-size:72px;margin-bottom:14px;filter:drop-shadow(0 4px 8px rgba(0,0,0,0.15));}
.music-title{font-size:20px;font-weight:700;}
.music-artist{font-size:14px;opacity:0.85;margin-top:4px;}
.music-progress{margin-top:20px;height:4px;background:rgba(255,255,255,0.3);border-radius:2px;position:relative;}
.music-progress::after{content:'';position:absolute;left:0;top:0;width:35%;height:100%;background:#fff;border-radius:2px;}
.music-controls{display:flex;justify-content:center;align-items:center;gap:24px;margin-top:18px;}
.music-btn{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.22);border:none;color:#fff;font-size:20px;cursor:pointer;transition:var(--transition);display:flex;align-items:center;justify-content:center;}
.music-btn.play{width:60px;height:60px;font-size:26px;background:rgba(255,255,255,0.32);}
.music-btn:active{transform:scale(0.9);}

/* ===== Toast ===== */
.ai-toast{position:absolute;bottom:120px;left:50%;transform:translateX(-50%);background:rgba(80,60,90,0.9);color:#fff;padding:10px 20px;border-radius:22px;font-size:13px;z-index:400;opacity:0;transition:opacity 0.3s ease;pointer-events:none;white-space:nowrap;backdrop-filter:blur(8px);}
.ai-toast.show{opacity:1;}

/* ===== Misc ===== */
::-webkit-scrollbar{width:0;}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-lighter);}
.empty-state .empty-icon{font-size:52px;margin-bottom:12px;}

.fab:active{transform:scale(0.88);}
.contact-actions{display:flex;gap:6px;}
</style>

// ===== NAVIGATION =====
function navigateTo(pageId){
  const pages=document.querySelectorAll('.page');
  const cur=document.getElementById('page-'+currentPage);
  const next=document.getElementById('page-'+pageId);
  if(!next)return;
  pages.forEach(p=>p.classList.remove('active','slide-left','slide-right'));
  if(cur&&cur!==next){
    const order=['home','chat','chat-detail','contact-profile','moments','cart','browser','notes','gallery','music','settings'];
    if(order.indexOf(pageId)>order.indexOf(currentPage))cur.classList.add('slide-left');
    else cur.classList.add('slide-right');
  }
  next.classList.add('active');currentPage=pageId;
}
function goHome(){if(currentPage==='chat-detail'){openApp('chat');return;}if(currentPage==='contact-profile'){navigateTo(prevPageBeforeProfile||'chat');return;}navigateTo('home');}
function openApp(app){
  navigateTo(app);
  switch(app){case'chat':renderChatList();break;case'moments':renderMoments();break;case'cart':renderCart();break;case'browser':renderBrowserHistory();break;case'notes':renderNotes();break;case'gallery':renderGallery();break;case'settings':renderSettings();break;}
}

  const days=['周日','周一','周二','周三','周四','周五','周六'];
  const d=(n.getMonth()+1)+'月'+n.getDate()+'日 '+days[n.getDay()];
  document.getElementById('statusTime').textContent=t;
  document.getElementById('lockTime').textContent=t;
  document.getElementById('lockDate').textContent=d;
  const wt=document.getElementById('widgetTime');if(wt)wt.textContent=t;
}

// ===== WALLPAPER =====
function applyWallpaper(){
  const wp=DATA.wallpaper||'default';
  const lw=document.getElementById('lockWallpaper');
  const hw=document.getElementById('homeWallpaper');
  if(wp==='custom'&&DATA.wallpaperImage){
    if(lw){lw.style.backgroundImage=`url(${DATA.wallpaperImage})`;lw.classList.remove('default-bg');}
    if(hw){hw.style.backgroundImage=`url(${DATA.wallpaperImage})`;hw.style.opacity='0.5';}
  }else{
    const preset=WALLPAPER_PRESETS.find(p=>p.id===wp);
    const grad=preset?preset.gradient:WALLPAPER_PRESETS[0].gradient;
    if(lw){lw.style.backgroundImage=grad;lw.classList.add('default-bg');}
    if(hw){hw.style.backgroundImage='';hw.style.opacity='0';}
  }
}
function setWallpaper(id){
  if(id==='custom'){
    document.getElementById('wallpaperFileInput').click();
    return;
  }
  DATA.wallpaper=id;DATA.wallpaperImage='';
  saveData();applyWallpaper();renderWallpaperOptions();
  showToast('✅ 壁纸已更换！');
}
function handleWallpaperUpload(input){
  const file=input.files[0];if(!file)return;
  if(file.size>3*1024*1024){showToast('⚠️ 图片不能超过3MB');return;}
  const reader=new FileReader();
  reader.onload=function(e){
    DATA.wallpaper='custom';DATA.wallpaperImage=e.target.result;
    saveData();applyWallpaper();renderWallpaperOptions();
    showToast('✅ 自定义壁纸已设置！');
  };
  reader.readAsDataURL(file);
  input.value='';
}
function renderWallpaperOptions(){
  const ct=document.getElementById('wallpaperOptions');if(!ct)return;
  const current=DATA.wallpaper||'default';
  ct.innerHTML=WALLPAPER_PRESETS.map(p=>{
    const isActive=p.id===current;
    const style=p.isUpload?'':`background:${p.gradient};`;
    const cls=`wallpaper-opt${isActive?' active':''}${p.isUpload?' upload-opt':''}`;
    return`<div class="${cls}" style="${style}" onclick="setWallpaper('${p.id}')" title="${p.name}">${p.isUpload?'📷':''}</div>`;
  }).join('');
}

function triggerAvatarFile(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){const f=inp.files[0];if(!f||f.size>2*1024*1024){showToast('⚠️ 图片<2MB');return;}const r=new FileReader();r.onload=function(e){document.getElementById('apPreview').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;window._tempAvatarData={type:'image',image:e.target.result};};r.readAsDataURL(f);};
  inp.click();
}
function confirmAvatarPick(){
  const td=window._tempAvatarData;
  const sel=document.querySelector('.avatar-emoji-item.selected');
  const emoji=sel?sel.textContent:'🌸';
  if(td&&td.type==='image'){
    if(avatarPickerTarget==='my'){DATA.myProfile.avatarType='image';DATA.myProfile.avatarImage=td.image;DATA.myProfile.avatar='📷';}
    else{const c=DATA.contacts.find(x=>x.id===avatarPickerTarget);if(c){c.avatarType='image';c.avatarImage=td.image;c.avatar='📷';}}
  }else{
    if(avatarPickerTarget==='my'){DATA.myProfile.avatarType='emoji';DATA.myProfile.avatar=emoji;DATA.myProfile.avatarImage='';}
    else{const c=DATA.contacts.find(x=>x.id===avatarPickerTarget);if(c){c.avatarType='emoji';c.avatar=emoji;c.avatarImage='';}}
  }

}

async function getAiResponse(cid,userMsg){
  const config=DATA.apiConfig;if(!config.key)return null;
  const contact=DATA.contacts.find(c=>c.id===cid);if(!contact)return null;
  const me=DATA.myProfile;
  const sp=(config.systemPrompt||'').replace(/\{userName\}/g,me.name).replace(/\{charName\}/g,contact.name).replace(/\{charPersonality\}/g,contact.personality).replace(/\{relationship\}/g,contact.relationship);
  const msgs=(DATA.messages[cid]||[]).slice(-10);
  const messages=[{role:'system',content:sp}];
  for(const m of msgs){messages.push({role:m.from==='me'?'user':'assistant',content:m.content});}
  try{
    if(config.provider==='anthropic')return await callAnthropic(config,messages);
    else return await callOpenAI(config,messages);
  }catch(e){console.error('AI:',e);return null;}
}
async function callOpenAI(config,messages){
  const r=await fetch(config.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+config.key},body:JSON.stringify({model:config.model,messages,temperature:0.8,max_tokens:300})});
  if(!r.ok)throw new Error('API '+r.status);
  const d=await r.json();return d.choices?.[0]?.message?.content?.trim()||null;
}
async function callAnthropic(config,messages){
  let sys='';const ams=[];
  for(const m of messages){if(m.role==='system'){sys=m.content;continue;}ams.push({role:m.role,content:m.content});}
  const body={model:config.model,max_tokens:300,messages:ams};if(sys)body.system=sys;
  const r=await fetch(config.url||'https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':config.key,'anthropic-version':'2023-06-01'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error('API '+r.status);
  const d=await r.json();return d.content?.[0]?.text?.trim()||null;
}

// ===== BROWSER =====
function renderBrowserHistory(){
  const ct=document.getElementById('historyList');if(!ct)return;
  const items=[...DATA.browserHistory].sort((a,b)=>b.time-a.time);
  if(!items.length){ct.innerHTML='<div class="empty-state"><div class="empty-icon">🌐</div><p>无浏览记录</p></div>';return;}
  ct.innerHTML=items.map(h=>`<div class="history-item"><div class="history-title">${h.title}</div><div class="history-url">🔗 ${h.url}</div><div class="history-time">${formatTime(h.time)}</div></div>`).join('');
}
function doSearch(){const input=document.getElementById('browserUrl');const q=input.value.trim();if(!q)return;DATA.browserHistory.unshift({id:genId(),title:q.includes('.')?q:'搜索: '+q,url:q.includes('.')?q:'www.search.com?q='+encodeURIComponent(q),time:Date.now()});saveData();input.value='';renderBrowserHistory();showToast('已添加~');}

// ===== NOTES =====
function renderNotes(){
  const ct=document.getElementById('notesList');if(!ct)return;
  const notes=[...DATA.notes].sort((a,b)=>b.time-a.time);
  if(!notes.length){ct.innerHTML='<div class="empty-state"><div class="empty-icon">📝</div><p>无备忘录</p></div>';return;}
  ct.innerHTML=notes.map(n=>`<div class="note-card"><div class="note-title">${n.title}</div><div class="note-content">${escapeHtml(n.content)}</div><div class="note-time">${formatTime(n.time)}</div><button class="btn btn-sm btn-danger" onclick="deleteNote('${n.id}')" style="margin-top:8px;">删除</button></div>`).join('');
}
function addNote(){const t=prompt('标题：');if(!t||!t.trim())return;const c=prompt('内容：');if(c===null)return;DATA.notes.unshift({id:genId(),title:t.trim(),content:c.trim(),time:Date.now()});saveData();renderNotes();}
function deleteNote(id){DATA.notes=DATA.notes.filter(n=>n.id!==id);saveData();renderNotes();}

// ===== GALLERY =====
function renderGallery(){const g=document.getElementById('galleryGrid');if(!g)return;g.innerHTML=GALLERY_PHOTOS.map(e=>`<div class="gallery-item">${e}</div>`).join('');}

// ===== SETTINGS =====
function renderSettings(){
  document.getElementById('setMyName').value=DATA.myProfile.name||'';
  document.getElementById('setMyAge').value=DATA.myProfile.age||'';
  document.getElementById('setMyPersonality').value=DATA.myProfile.personality||'';
  document.getElementById('setMyBio').value=DATA.myProfile.bio||'';
  document.getElementById('setApiProvider').value=DATA.apiConfig.provider||'openai';
  document.getElementById('setApiUrl').value=DATA.apiConfig.url||'';
  document.getElementById('setApiKey').value=DATA.apiConfig.key||'';
  document.getElementById('setApiModel').value=DATA.apiConfig.model||'';
  document.getElementById('setSystemPrompt').value=DATA.apiConfig.systemPrompt||'';
  onProviderChange();renderWallpaperOptions();
}
function onProviderChange(){
  const p=document.getElementById('setApiProvider').value;
  const u=document.getElementById('setApiUrl'),m=document.getElementById('setApiModel');
  if(p==='openai'){u.value='https://api.openai.com/v1/chat/completions';m.value='gpt-4o-mini';}
  else if(p==='anthropic'){u.value='https://api.anthropic.com/v1/messages';m.value='claude-haiku-4-5-20251001';}
}
function saveMyProfile(){
  DATA.myProfile.name=document.getElementById('setMyName').value.trim()||DATA.myProfile.name;
  DATA.myProfile.age=document.getElementById('setMyAge').value.trim()||DATA.myProfile.age;
  DATA.myProfile.personality=document.getElementById('setMyPersonality').value.trim()||DATA.myProfile.personality;
  DATA.myProfile.bio=document.getElementById('setMyBio').value.trim()||DATA.myProfile.bio;
  saveData();showToast('✅ 已保存！');
}
function saveApiConfig(){
  DATA.apiConfig.provider=document.getElementById('setApiProvider').value;
  DATA.apiConfig.url=document.getElementById('setApiUrl').value.trim();
  DATA.apiConfig.key=document.getElementById('setApiKey').value.trim();
  DATA.apiConfig.model=document.getElementById('setApiModel').value.trim();
  DATA.apiConfig.systemPrompt=document.getElementById('setSystemPrompt').value.trim();
  saveData();showToast('✅ 已保存！');
}
async function testApiConnection(){
  const config={provider:document.getElementById('setApiProvider').value,url:document.getElementById('setApiUrl').value.trim(),key:document.getElementById('setApiKey').value.trim(),model:document.getElementById('setApiModel').value.trim()};
  if(!config.key){showToast('⚠️ 请填API Key');return;}
  showToast('⏳ 测试中...');
  try{const msgs=[{role:'system',content:'回复"成功"'},{role:'user',content:'测试'}];let r;if(config.provider==='anthropic')r=await callAnthropic(config,msgs);else r=await callOpenAI(config,msgs);if(r)showToast('✅ '+r.substring(0,20));else showToast('⚠️ 无回复');}catch(e){showToast('❌ '+e.message);}
}
function exportData(){const b=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='virtual-phone-backup.json';a.click();URL.revokeObjectURL(u);showToast('✅ 已导出');}
function importDataPrompt(){const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(d.myProfile&&d.contacts){DATA=d;saveData();applyTheme();applyWallpaper();startAutoMoments();showToast('✅ 已导入！');goHome();}else{showToast('⚠️ 格式不对');}}catch(ex){showToast('⚠️ 解析失败');}};r.readAsText(f);};inp.click();}
function clearAllData(){if(confirm('确定清除所有数据？建议先导出备份。')){localStorage.removeItem(STORAGE_KEY);DATA=defaultData();saveData();applyTheme();applyWallpaper();startAutoMoments();showToast('✅ 已重置');goHome();}}

// ===== ADD CONTACT =====
function showAddContactModal(){
  const overlay=document.getElementById('modalOverlay'),content=document.getElementById('modalContent');
  window._newAvatarData=null;
  content.innerHTML=`
    <h3 style="margin-bottom:14px;color:var(--text);">➕ 添加联系人</h3>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
      <div id="newAvPreview" style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,var(--pink-light),var(--lavender-light));">👤</div>
      <button class="btn btn-sm btn-outline" onclick="pickNewContactAvatar()">🎨 选头像</button>
    </div>
    <div class="settings-field"><label>名字</label><input type="text" id="newContactName"></div>
    <div class="settings-field"><label>性格</label><textarea id="newContactPersonality"></textarea></div>
    <div class="settings-field"><label>关系</label><input type="text" id="newContactRelation"></div>
    <div class="settings-field"><label>简介</label><input type="text" id="newContactBio"></div>
    <button class="btn btn-primary" onclick="addContact()">✅ 添加</button>
    <button class="btn btn-outline" onclick="closeModalSimple()" style="margin-left:8px;">取消</button>
  `;
  overlay.classList.add('show');
}
function pickNewContactAvatar(){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
  inp.onchange=function(){const f=inp.files[0];if(!f||f.size>2*1024*1024){showToast('⚠️ <2MB');return;}const r=new FileReader();r.onload=function(e){document.getElementById('newAvPreview').innerHTML=`<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;window._newAvatarData={type:'image',image:e.target.result};};r.readAsDataURL(f);};
  inp.click();
}
function addContact(){
  const name=document.getElementById('newContactName').value.trim();if(!name){showToast('请输入名字');return;}
  const ad=window._newAvatarData;
  const c={id:genId(),name,avatar:ad?'📷':'👤',avatarType:ad?ad.type:'emoji',avatarImage:ad?ad.image:'',personality:document.getElementById('newContactPersonality').value.trim()||'有趣的人',relationship:document.getElementById('newContactRelation').value.trim()||'朋友',bio:document.getElementById('newContactBio').value.trim()||''};
  DATA.contacts.push(c);DATA.messages[c.id]=[];
  saveData();closeModalSimple();renderChatList();showToast('✅ 已添加！');
}

// ===== MODAL =====
function closeModal(e){if(e.target===document.getElementById('modalOverlay'))closeModalSimple();}
function closeModalSimple(){document.getElementById('modalOverlay').classList.remove('show');}

// ===== UTILITY =====
function formatTime(ts){const diff=Date.now()-ts;if(diff<60000)return'刚刚';if(diff<3600000)return Math.floor(diff/60000)+'分钟前';if(diff<86400000)return Math.floor(diff/3600000)+'小时前';if(diff<172800000)return'昨天';const d=new Date(ts);return(d.getMonth()+1)+'/'+d.getDate();}
function formatTimeLabel(ts){const d=new Date(ts);const h=String(d.getHours()).padStart(2,'0'),m=String(d.getMinutes()).padStart(2,'0');return(d.getMonth()+1)+'月'+d.getDate()+'日 '+h+':'+m;}
function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function showToast(msg){const t=document.getElementById('aiToast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

// ===== TOUCH GESTURES =====
// Tap status bar to close notification center
document.querySelector('.status-bar').addEventListener('click',()=>{
  if(document.getElementById('notifCenter').classList.contains('show'))closeNotifCenter();
});
// Click anywhere outside to close notif center
document.getElementById('pageContainer').addEventListener('click',(e)=>{
  const nc=document.getElementById('notifCenter');
  if(nc.classList.contains('show')&&!nc.contains(e.target))closeNotifCenter();
});

// ===== MIGRATION & INIT =====
function migrateData(){
  let m=false;
  if(!DATA.theme){DATA.theme='pink';m=true;}
  if(!DATA.wallpaper){DATA.wallpaper='default';m=true;}
  if(!DATA.wallpaperImage){DATA.wallpaperImage='';m=true;}
  if(!DATA.notifications)DATA.notifications=[];
  if(!DATA.myProfile.avatarType){DATA.myProfile.avatarType='emoji';DATA.myProfile.avatarImage='';m=true;}
  for(const c of DATA.contacts){if(!c.avatarType){c.avatarType='emoji';c.avatarImage='';m=true;}}
  if(m)saveData();
}

function init(){
  migrateData();updateClock();setInterval(updateClock,30000);
  applyTheme();applyWallpaper();renderChatList();updateNotifBadges();
  startAutoMoments();
}
