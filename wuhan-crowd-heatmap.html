<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>武汉实时人群热力分布</title>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fdfdfc;--card:#fff;--ink:#2a2a26;--accent:#c42e24;--border:#d8d4ce;--shadow:rgba(0,0,0,0.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Serif SC",serif;background:var(--bg);height:100vh;overflow:hidden;display:flex;flex-direction:column}
#topbar{position:relative;z-index:200;background:var(--card);border-bottom:1px solid var(--border);padding:9px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 3px var(--shadow)}
#topbar .logo{font-size:1.3rem}
#topbar h1{font-family:"Ma Shan Zheng",cursive;font-size:1.4rem;color:var(--accent);letter-spacing:.05em;font-weight:400}
#topbar .sub{font-size:.64rem;color:#777;margin-left:6px}
#sim-clock{display:flex;align-items:center;gap:6px;margin-left:auto;background:#f5f3ef;border:1px solid var(--border);border-radius:14px;padding:3px 10px;font-size:.65rem;color:#666}
#sim-clock .time{color:var(--accent);font-weight:700;font-family:monospace;font-size:.76rem}
#sim-clock .dot{width:7px;height:7px;border-radius:50%;background:#4a4;box-shadow:0 0 5px #4a4;animation:pulse-dot 1.5s ease-infinite}
@keyframes pulse-dot{0%,100%{opacity:1}50%{opacity:.3}}
#map-wrap{flex:1;position:relative;background:var(--bg)}
#map{position:absolute;inset:0;z-index:1}
#white-cover{position:absolute;inset:0;z-index:5;background:var(--bg);pointer-events:none}
#overlay-canvas{position:absolute;inset:0;z-index:10;pointer-events:none}
#info-panel{position:absolute;top:12px;left:14px;z-index:1000;background:rgba(255,255,255,.94);border:1px solid var(--border);border-radius:12px;padding:14px 15px;box-shadow:0 2px 12px var(--shadow);pointer-events:none;min-width:172px}
#info-panel h3{font-family:"Ma Shan Zheng",cursive;font-size:.78rem;color:var(--accent);margin-bottom:5px;font-weight:400;border-bottom:1px solid #e8e4de;padding-bottom:4px}
.info-row{display:flex;flex-direction:column;gap:3px;margin:5px 0}
.info-row span{font-size:.62rem;color:#555}
.info-row b{color:var(--ink);font-size:.7rem}
.info-mini{display:flex;align-items:center;gap:5px;font-size:.56rem;color:#666;margin:3px 0}
.info-mini .swatch{width:10px;height:10px;border-radius:50%;flex-shrink:0}
#legend{position:absolute;bottom:28px;right:16px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:0 2px 14px var(--shadow);min-width:195px}
#legend .title{font-family:"Ma Shan Zheng",cursive;font-size:.72rem;color:var(--accent);margin-bottom:6px;font-weight:400}
#legend .grad-bar{width:100%;height:10px;border-radius:5px;margin:4px 0}
#legend .grad-labels{display:flex;justify-content:space-between;font-size:.54rem;color:#777;padding:0 2px}
.leg-row2{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:.55rem;color:#666}
.leg-row2 .line-sample{width:22px;height:0;flex-shrink:0}
.dot-sample-group{display:flex;align-items:flex-end;gap:8px;margin:3px 0}
.dot-sample-item{text-align:center}
.dot-sample-item canvas{display:block;margin:0 auto}
.dot-sample-item .lbl{font-size:.5rem;color:#777;margin-top:1px}
#hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:1000;background:rgba(255,255,255,.88);border:1px solid var(--border);border-radius:12px;padding:3px 12px;font-size:.56rem;color:#999;pointer-events:none}
@media(max-width:768px){#info-panel,#legend{display:none}}
</style>
</head>

</div>

// ==================== 粒子生成 ====================
var BASE=750, particles=[];
hotspots.forEach(function(h){
  var n=Math.round(h.level*BASE);
  for(var i=0;i<n;i++){
    var a=Math.random()*Math.PI*2, d=Math.pow(Math.random(),0.55)*h.r*0.011;
    particles.push({hs:h,baseLng:h.lng,baseLat:h.lat,lng:h.lng+Math.cos(a)*d,lat:h.lat+Math.sin(a)*d,oLng:Math.cos(a)*d,oLat:Math.sin(a)*d,maxR:h.r*0.011,driftA:Math.random()*Math.PI*2,driftS:15e-6+Math.random()*6e-5,pulseP:Math.random()*Math.PI*2,pulseS:.015+Math.random()*.03});
  }
});

// ==================== 百度地图（底层, 瓦片被白色div遮挡）====================

m.centerAndZoom(new BMapGL.Point(114.31,30.58),11);
m.enableScrollWheelZoom(true);
m.addControl(new BMapGL.ZoomControl({anchor:BMAP_ANCHOR_BOTTOM_LEFT,offset:new BMapGL.Size(20,90)}));

// ==================== 获取13区边界 ====================

var distBounds={},distCentroids={},loaded=0;
DISTS.forEach(function(name){
  new BMapGL.Boundary().get(name,function(rs){
    if(rs&&rs.boundaries){
      distBounds[name]=rs.boundaries;
      var sl=0,st=0,c=0;
      rs.boundaries.forEach(function(b){b.split(";").forEach(function(p){var pp=p.split(",");sl+=parseFloat(pp[0]);st+=parseFloat(pp[1]);c++;});});
      distCentroids[name]={lng:sl/c,lat:st/c};
    }
    loaded++;
  });
});

// ==================== 画布 ====================
var canvas=document.getElementById("overlay-canvas");
var ctx=canvas.getContext("2d");
var dpr=window.devicePixelRatio||1;

function resizeCanvas(){
  var wrap=document.getElementById("map-wrap");
  var w=wrap.clientWidth,h=wrap.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  canvas.style.width=w+'px';canvas.style.height=h+'px';
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

// ==================== 模拟时钟 ====================
var simH=17,simM=30;
function tickClock(){
  simM+=0.4;if(simM>=60){simM=0;simH++;}if(simH>=24)simH=0;
  document.getElementById("sim-time").textContent=("0"+Math.floor(simH)).slice(-2)+":"+("0"+Math.floor(simM)).slice(-2);
}
function tf(){var h=simH+simM/60;if(h<6)return.22;if(h<8)return.85;if(h<11)return.62;if(h<13)return.78;if(h<17)return.68;if(h<19)return 1;if(h<22)return.8;return.35;}

// ==================== 主循环 ====================
var fc=0;
function loop(){
  fc++;tickClock();
  updateParticles();
  render();
  if(fc%15===0)updateInfo();
  requestAnimationFrame(loop);
}

function updateParticles(){
  var t=tf();
  for(var i=0,p;i<particles.length;i++){
    p=particles[i];
    p.driftA+=(Math.random()-.5)*.35;var s=p.driftS*(.4+t*.6);
    p.oLng+=Math.cos(p.driftA)*s;p.oLat+=Math.sin(p.driftA)*s;
    var d=Math.sqrt(p.oLng*p.oLng+p.oLat*p.oLat);
    if(d>p.maxR){p.oLng*=.92;p.oLat*=.92;p.driftA=Math.atan2(-p.oLat,-p.oLng)+(Math.random()-.5)*.4;}
    if(Math.random()<.00025){var a2=Math.random()*Math.PI*2,d2=Math.pow(Math.random(),.55)*p.maxR;p.oLng=Math.cos(a2)*d2;p.oLat=Math.sin(a2)*d2;}
    p.lng=p.baseLng+p.oLng;p.lat=p.baseLat+p.oLat;
    p.pulseP+=p.pulseS;if(p.pulseP>Math.PI*2)p.pulseP-=Math.PI*2;
  }
}

function render(){
  var w=canvas.width/dpr,h=canvas.height/dpr;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.scale(dpr,dpr);

  // 1. 白色背景
  ctx.fillStyle='#fdfdfc';ctx.fillRect(0,0,w,h);

  // 2. 各区边界
  var hasData=false;
  for(var name in distBounds){
    hasData=true;
    distBounds[name].forEach(function(b){
      var pts=b.split(";");
      ctx.beginPath();
      pts.forEach(function(p,i){
        var pp=p.split(","),proj=m.pointToPixel(new BMapGL.Point(parseFloat(pp[0]),parseFloat(pp[1])));
        if(!proj)return;
        if(i===0)ctx.moveTo(proj.x,proj.y);else ctx.lineTo(proj.x,proj.y);
      });
      ctx.closePath();
      ctx.strokeStyle='rgba(120,90,70,0.72)';ctx.lineWidth=2.0;ctx.setLineDash([5,5]);ctx.stroke();ctx.setLineDash([]);
    });
  }

  // 3. 武汉整体轮廓
  ctx.beginPath();
  WH_BOUND.forEach(function(poly){
    poly.forEach(function(ring,ri){
      ring.forEach(function(pt,i){
        var proj=m.pointToPixel(new BMapGL.Point(pt[0],pt[1]));
        if(!proj)return;
        if(i===0||ri===0&&i===0)ctx.moveTo(proj.x,proj.y);else ctx.lineTo(proj.x,proj.y);
      });
    });
  });
  if(hasData){
    // 百度数据已有各区 → 武汉轮廓用细线
    ctx.strokeStyle='rgba(120,90,70,0.5)';ctx.lineWidth=2.2;ctx.setLineDash([]);ctx.stroke();
  }else{
    // Fallback: 更突出
    ctx.strokeStyle='rgba(120,90,70,0.75)';ctx.lineWidth=2.8;ctx.setLineDash([8,6]);ctx.stroke();ctx.setLineDash([]);
  }

  // 4. 粒子
  var t=tf(),batches=[],bm={};
  for(var i=0;i<particles.length;i++){
    var p=particles[i],pulse=.7+.3*Math.sin(p.pulseP),bonus=hBonus(p.hs),alpha=.075*t*pulse*bonus;
    var key=Math.round(p.hs.level*10)/10,k=key.toFixed(1);
    if(!bm[k]){bm[k]=[];batches.push({lv:key,pts:bm[k]});}
    bm[k].push({p:p,alpha:alpha});
  }
  batches.sort(function(a,b){return a.lv-b.lv;});
  for(var bi=0;bi<batches.length;bi++){
    var batch=batches[bi],lv=batch.lv,r,g,b;
    if(lv>=.9){r=185;g=20;b=12;}else if(lv>=.7){r=210;g=42;b=18;}else if(lv>=.5){r=225;g=75;b=28;}else if(lv>=.3){r=235;g=120;b=38;}else{r=240;g=155;b=50;}
    ctx.fillStyle='rgba('+r+','+g+','+b+',1)';
    for(var pi=0;pi<batch.pts.length;pi++){
      var item=batch.pts[pi],proj=m.pointToPixel(new BMapGL.Point(item.p.lng,item.p.lat));
      if(!proj||proj.x<-20||proj.x>w+20||proj.y<-20||proj.y>h+20)continue;
      ctx.globalAlpha=Math.min(.7,item.alpha);
      ctx.beginPath();ctx.arc(proj.x,proj.y,2.5,0,Math.PI*2);ctx.fill();
    }
  }
  ctx.globalAlpha=1;

  // 5. 区名标签
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.font='700 13px "Noto Serif SC",sans-serif';
  for(var name in distCentroids){
    var c=distCentroids[name],proj=m.pointToPixel(new BMapGL.Point(c.lng,c.lat));
    if(!proj||proj.x<0||proj.x>w||proj.y<0||proj.y>h)continue;
    ctx.fillStyle='rgba(110,80,60,0.62)';
    ctx.fillText(name,proj.x,proj.y);
  }
}

// ==================== 信息面板 ====================
function updateInfo(){
  document.getElementById("info-particles").textContent=(particles.length/1000).toFixed(1)+"k";
  document.getElementById("info-hotspots").textContent=hotspots.length;
  document.getElementById("info-dists").textContent=loaded+"/13 区";
  var t=tf(),maxH=null,maxV=0;
  hotspots.forEach(function(h){var v=h.level*t*hBonus(h);if(v>maxV){maxV=v;maxH=h;}});
  document.getElementById("info-peak").textContent=maxH?maxH.n:"-";
}
updateInfo();

// ==================== 图例小Canvas ====================
function drawDotSamples(){
  var samples=[
    {id:'ds-low',color:[240,155,50],dots:[{x:18,y:18,r:2,a:.7}]},
    {id:'ds-mid',color:[225,75,28],dots:[{x:18,y:16,r:2.5,a:.8},{x:10,y:22,r:2,a:.5},{x:26,y:22,r:2,a:.5}]},
    {id:'ds-hi', color:[185,25,12],dots:[{x:18,y:16,r:3,a:.9},{x:10,y:10,r:2,a:.6},{x:26,y:10,r:2,a:.6},{x:10,y:24,r:2,a:.5},{x:26,y:24,r:2,a:.5}]}
  ];
  samples.forEach(function(s){
    var c=document.getElementById(s.id);if(!c)return;
    var cx=c.getContext("2d"),sz=36;
    cx.clearRect(0,0,sz,sz);
    var grad=cx.createRadialGradient(sz/2,sz/2,0,sz/2,sz/2,sz/2);
    grad.addColorStop(0,'rgba('+s.color[0]+','+s.color[1]+','+s.color[2]+',0.22)');
    grad.addColorStop(0.5,'rgba('+s.color[0]+','+s.color[1]+','+s.color[2]+',0.06)');
    grad.addColorStop(1,'rgba('+s.color[0]+','+s.color[1]+','+s.color[2]+',0)');
    cx.fillStyle=grad;cx.fillRect(0,0,sz,sz);
    s.dots.forEach(function(d){cx.beginPath();cx.arc(d.x,d.y,d.r,0,Math.PI*2);cx.fillStyle='rgba('+s.color[0]+','+s.color[1]+','+s.color[2]+','+d.a+')';cx.fill();});
  });
}
setTimeout(drawDotSamples,200);

// ==================== 启动 ====================
requestAnimationFrame(loop);
